# LSHE centre server: Kolibri + PostgreSQL, fully offline.
#
# Tablets on the centre Wi-Fi open http://<server LAN IP>:8080 in a browser.
# Videos come from 8080; zipped (HTML5/H5P) content from a second origin on
# LSHE_ZIP_PORT (default 8081), so both ports must reach the LAN.
#
# Usage, from this directory (docker/lshe):
#   cp .env.example .env     # then fill it in; .env is git-ignored
#   docker compose up -d --build
#
# See README.md for MindSpark (MongoDB) access and firewall notes. The
# import, band and report scripts are in kolibri_helper_scripts (lshe/),
# mounted into the Kolibri container below.

name: lshe

services:
  db:
    image: postgres:13
    container_name: lshe-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KOLIBRI_DATABASE_NAME:-kolibri}
      POSTGRES_USER: ${KOLIBRI_DATABASE_USER:-kolibri}
      POSTGRES_PASSWORD: ${KOLIBRI_DATABASE_PASSWORD:?set KOLIBRI_DATABASE_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published: only Kolibri, on the internal network, talks to Postgres.
    networks: [lshe]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KOLIBRI_DATABASE_USER:-kolibri} -d ${KOLIBRI_DATABASE_NAME:-kolibri}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kolibri:
    build:
      context: ../..
      dockerfile: docker/testserver.dockerfile
    container_name: lshe-kolibri
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      KOLIBRI_HOME: /kolibrihome
      KOLIBRI_HTTP_PORT: "8080"
      # Pinned so it can be published; Kolibri otherwise picks a random port.
      # Browsers are told this port, so it must be the same inside and out.
      KOLIBRI_ZIP_CONTENT_PORT: "${LSHE_ZIP_PORT:-8081}"
      KOLIBRI_RUN_MODE: lshe
      KOLIBRI_DATABASE_ENGINE: postgres
      KOLIBRI_DATABASE_HOST: db
      KOLIBRI_DATABASE_PORT: "5432"
      KOLIBRI_DATABASE_NAME: ${KOLIBRI_DATABASE_NAME:-kolibri}
      KOLIBRI_DATABASE_USER: ${KOLIBRI_DATABASE_USER:-kolibri}
      KOLIBRI_DATABASE_PASSWORD: ${KOLIBRI_DATABASE_PASSWORD:?set KOLIBRI_DATABASE_PASSWORD in .env}
      # Learners sign in by username with no password.
      KOLIBRI_PROVISIONDEVICE_PRESET: formal
      # docker/entrypoint.py would otherwise create the superuser with the
      # default password "admin123".
      KOLIBRI_PROVISIONDEVICE_SUPERUSERPASSWORD: ${KOLIBRI_PROVISIONDEVICE_SUPERUSERPASSWORD:?set KOLIBRI_PROVISIONDEVICE_SUPERUSERPASSWORD in .env}
      # Month boundaries for reports, and log timestamps.
      TZ: ${TZ:-Africa/Lusaka}
      LSHE_REPORT_TIMEZONE: ${LSHE_REPORT_TIMEZONE:-Africa/Lusaka}
      LSHE_REPORT_DIR: /srv/lshe-reports
      KOLIBRI_CENTRE_CODE: ${KOLIBRI_CENTRE_CODE:?set KOLIBRI_CENTRE_CODE in .env}
      # LSHE carries no adaptive assessments; grade bands are always enforced.
      LSHE_DISABLE_ASSESSMENTS: "true"
      LSHE_GRADE_BANDS: "on"
    ports:
      # Bind to the centre LAN address only (not NetBird or other interfaces).
      # Docker-published ports bypass UFW, so this binding is what limits them.
      - "${LSHE_BIND_IP:?set LSHE_BIND_IP (the server's centre LAN address) in .env}:8080:8080"
      - "${LSHE_BIND_IP}:${LSHE_ZIP_PORT:-8081}:${LSHE_ZIP_PORT:-8081}"
    volumes:
      - kolibrihome:/kolibrihome
      # Monthly report CSVs, read by the host's timer and collected centrally.
      - /srv/lshe-reports:/srv/lshe-reports
      # Channel packs for importchannel/importcontent disk (import_channels.sh).
      - ${LSHE_CONTENT_DIR:-/srv/lshe-content}:/srv/lshe-content:ro
      # Channel packs made from this server's channels (export_channels.sh),
      # to copy to a USB disk or another server.
      - ${LSHE_EXPORT_DIR:-/srv/lshe-export}:/srv/lshe-export
      # kolibri_helper_scripts (roster import, grade bands, monthly report).
      # Its lshe/*.sh scripts run on the host and call lshe/*.py in here.
      - ${LSHE_HELPER_SCRIPTS_DIR:-/opt/lshe/kolibri_helper_scripts}:/opt/kolibri_helper_scripts:ro
    networks: [lshe]

networks:
  lshe:
    # A fixed subnet, so the host firewall can allow MindSpark's MongoDB to
    # this subnet only (see README.md, "Reaching MindSpark").
    ipam:
      config:
        - subnet: ${LSHE_DOCKER_SUBNET:-172.30.50.0/24}

volumes:
  pgdata:
  kolibrihome:
